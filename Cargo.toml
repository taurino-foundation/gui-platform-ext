[package]
name = "gui-platform-ext"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
anyhow = "1.0.104"
getrandom = "0.4.3"
log = "0.4.34"
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
dpi = { version = "0.1.2", features = ["serde"] }
tao = { version = "0.37.0", default-features = false, features = ["rwh_06"] }

# ─────────────────────────────────────────────
# Windows
# ─────────────────────────────────────────────

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
softbuffer = { version = "0.4.8", default-features = false }
once_cell = "1.21.4"
webview2-com = "0.39.1"
# ─────────────────────────────────────────────
# macOS
# ─────────────────────────────────────────────

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"

objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "block2",
    "NSApplication",
    "NSResponder",
    "NSScreen",
    "NSWindow",
] }

# ─────────────────────────────────────────────
# Linux / BSD
# ─────────────────────────────────────────────


[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18.2"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }



[features]
common-controls-v6 = []
